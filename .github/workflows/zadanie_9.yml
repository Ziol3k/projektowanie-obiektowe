name: Zadanie 9 Cloud CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "zadanie_5/**"
      - "zadanie_9/**"
      - ".github/workflows/zadanie_9.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ziol3k/zadanie9-backend
  FRONTEND_IMAGE: ghcr.io/ziol3k/zadanie9-frontend

jobs:
  build:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: zadanie_5/backend
          file: zadanie_5/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: zadanie_5/frontend
          file: zadanie_5/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Send build notification email
        if: always()
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.wp.pl
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Zadanie 9 - build ${{ job.status }}
          to: ${{ secrets.MAIL_TO }}
          from: ${{ secrets.MAIL_USERNAME }}
          body: |
            Build aplikacji Zadanie 9 zakończony statusem: ${{ job.status }}

            Repozytorium: ${{ github.repository }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}

  deploy:
    name: Deploy to cloud VM
    runs-on: ubuntu-latest
    needs: build

    env:
      BACKEND_IMAGE: ghcr.io/ziol3k/zadanie9-backend:latest
      FRONTEND_IMAGE: ghcr.io/ziol3k/zadanie9-frontend:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check deployment secrets
        run: |
          test -n "${{ secrets.VM_HOST }}" || (echo "VM_HOST missing" && exit 1)
          test -n "${{ secrets.VM_USER }}" || (echo "VM_USER missing" && exit 1)
          test -n "${{ secrets.VM_SSH_KEY }}" || (echo "VM_SSH_KEY missing" && exit 1)
          test -n "${{ secrets.GHCR_USERNAME }}" || (echo "GHCR_USERNAME missing" && exit 1)
          test -n "${{ secrets.GHCR_TOKEN }}" || (echo "GHCR_TOKEN missing" && exit 1)
          echo "Deployment secrets are present"

      - name: Copy deployment files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          source: "zadanie_9/docker-compose.prod.yml,zadanie_9/scripts/deploy.sh"
          target: "~/zadanie_9"
          strip_components: 1

      - name: Deploy application on VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: BACKEND_IMAGE,FRONTEND_IMAGE
          script: |
            cd ~/zadanie_9

            export BACKEND_IMAGE="${BACKEND_IMAGE}"
            export FRONTEND_IMAGE="${FRONTEND_IMAGE}"
            export GHCR_USERNAME="${{ secrets.GHCR_USERNAME }}"
            export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"

            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh